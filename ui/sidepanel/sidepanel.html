<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Reader - Bảng điều khiển</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="sidepanel-container">
    <!-- Header -->
    <header class="sidepanel-header">
      <h2><i class="fas fa-columns"></i> Bảng điều khiển</h2>
      <button class="btn-close" id="btnClose">
        <i class="fas fa-times"></i>
      </button>
    </header>

    <!-- Danh sách chương -->
    <section class="chapters-section">
      <h3><i class="fas fa-list-ol"></i> Danh sách chương</h3>
      <div class="chapters-list" id="chaptersList">
        <!-- Chapters will be loaded here -->
      </div>
    </section>

    <!-- Lịch sử đọc -->
    <section class="history-section">
      <h3><i class="fas fa-history"></i> Lịch sử đọc</h3>
      <div class="history-list" id="historyList">
        <!-- Reading history will be loaded here -->
      </div>
    </section>

    <!-- Bookmarks -->
    <section class="bookmarks-section">
      <h3><i class="fas fa-bookmark"></i> Đánh dấu</h3>
      <div class="bookmarks-list" id="bookmarksList">
        <!-- Bookmarks will be loaded here -->
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="quick-actions">
      <button class="btn-action" id="btnAddBookmark">
        <i class="fas fa-bookmark"></i>
        <span>Đánh dấu vị trí hiện tại</span>
      </button>
      <button class="btn-action" id="btnClearHistory">
        <i class="fas fa-trash"></i>
        <span>Xóa lịch sử</span>
      </button>
      <button class="btn-action" id="btnExportLogs">
        <i class="fas fa-download"></i>
        <span>Xuất log</span>
      </button>
    </section>
  </div>

  <script src="../../utils/constants.js"></script>
  <script src="../../utils/LogService.js"></script>
  <script src="../../utils/StorageService.js"></script>
  <script src="../../utils/SharedServices.js"></script>
  <script src="../BaseUI.js"></script>
  <script src="sidepanel.js"></script>
</body>

</html>
